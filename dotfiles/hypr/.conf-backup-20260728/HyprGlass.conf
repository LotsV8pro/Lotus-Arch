# HyprGlass — Liquid Glass effect for Waybar
# Install: sudo hyprpm add https://github.com/hyprnux/hyprglass && sudo hyprpm enable hyprglass
# Then reload: hyprctl reload

plugin:hyprglass {
    default_theme = dark
    default_preset = clear

    # --- Configuración del preset "apple" ---
    blur_strength = 2.2
    blur_iterations = 3
    refraction_strength = 0.55
    chromatic_aberration = 0.3
    fresnel_strength = 0.5
    specular_strength = 0.75
    edge_thickness = 0.05
    lens_distortion = 0.3

    # Ajustes para modo oscuro (dark)
    dark:brightness = 0.82
    dark:contrast = 0.90
    dark:saturation = 0.80
    dark:vibrancy = 0.15
    dark:adaptive_dim = 0.4

    # Ajustes para modo claro (light)
    light:brightness = 1.12
    light:contrast = 0.92
    light:saturation = 0.85
    light:vibrancy = 0.12
    light:adaptive_boost = 0.4
    # --------------------------------------

    layers {
        enabled = 1
        namespaces = waybar
        preset = subtle
        namespace_mask_thresholds = waybar=0.05
    }
}
