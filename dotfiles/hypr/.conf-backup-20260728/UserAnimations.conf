#
# D̷E̷D̷S̷E̷C̷ Animations (Purple / Smooth)
# Fluid, modern, refined transitions

animations {
    enabled = true

    # Smooth material bezier
    bezier = dedsec, 0.22, 0.61, 0.36, 1.0
    bezier = dedsec-fast, 0.15, 0.8, 0.3, 1.0
    bezier = dedsec-spring, 0.34, 1.56, 0.64, 1.0

    # Windows: slide with smooth ease
    animation = windows, 1, 5, dedsec, slide
    animation = windowsOut, 1, 4, dedsec-fast, slide

    # Borders: gentle pulse
    animation = border, 1, 10, dedsec
    animation = borderangle, 1, 8, dedsec

    # Fade: soft and smooth
    animation = fade, 1, 5, dedsec

    # Workspaces: fluid slide
    animation = workspaces, 1, 5, dedsec, slide

    # Special workspace
    animation = specialWorkspace, 1, 5, dedsec, slidevert
}
