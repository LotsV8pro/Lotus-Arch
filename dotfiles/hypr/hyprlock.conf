# Pixie-style hyprlock — mirrors the SDDM "pixie" theme
# Colors are pulled from the system-wide wallust palette
# (wallust-hyprland.conf) so the lock screen follows the current wallpaper.

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

$accent = $color2
$accent2 = $color3
$text = $foreground
$surface = $color8
$card = rgba(20, 18, 24, 0.72)

general {
    fractional_scaling = 2
    hide_cursor = true
    immediate_render = true
}

# Blurred, dimmed wallpaper (pixie login-state background)
background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_blurred
    color = $background
    blur_size = 0
    blur_passes = 0
    noise = 0.0
    brightness = 0.65
    contrast = 1.1
    vibrancy = 0.0
}

# Date — top left, like pixie
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %-d')"
    color = $accent
    font_size = 22
    font_family = Google Sans Flex Freeze
    position = 60, -50
    halign = left
    valign = top
}

# Big two-tone clock — pixie's 2x2 digits, hours on top, minutes below
# NOTE: hyprlock positions positive y = up; negative x = left
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I' | cut -c1)"
    color = $accent
    font_size = 170
    font_family = Google Sans Flex Freeze
    position = -70, 300
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I' | cut -c2)"
    color = $accent
    font_size = 170
    font_family = Google Sans Flex Freeze
    position = 70, 300
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%M' | cut -c1)"
    color = $accent2
    font_size = 170
    font_family = Google Sans Flex Freeze
    position = -70, 150
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%M' | cut -c2)"
    color = $accent2
    font_size = 170
    font_family = Google Sans Flex Freeze
    position = 70, 150
    halign = center
    valign = center
}

# Login card — rounded, dark, translucent
shape {
    monitor =
    size = 380, 190
    color = $card
    rounding = 32
    position = 0, -235
    halign = center
    valign = center
}

# Password field — pixie-style rounded input
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    font_family = Google Sans Flex Freeze
    rounding = 16
    placeholder_text = Enter Password
    hide_input = false
    fade_on_empty = false
    position = 0, -235
    halign = center
    valign = center
}
