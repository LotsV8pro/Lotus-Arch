# D̷E̷D̷S̷E̷C̷ Lock Screen (Purple)

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
    grace = 0
    fractional_scaling = 2
    immediate_render = true
    disable_loading_bar = true
}

# Background
background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(13, 10, 26)
    blur_size = 10
    blur_passes = 4
    noise = 0.02
    contrast = 1.2
    brightness = 0.5
    vibrancy = 0.0
}

# Scanline overlay
shape {
    monitor =
    size = 9999, 2
    color = rgba(180, 74, 255, 0.02)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# Top accent line
shape {
    monitor =
    size = 340, 2
    color = rgba(180, 74, 255, 0.7)
    rounding = 1
    position = 0, 108
    halign = center
    valign = center
}

# System label background
shape {
    monitor =
    size = 340, 44
    color = rgba(180, 74, 255, 0.12)
    rounding = 10
    position = 0, 82
    halign = center
    valign = center
}

# System label
label {
    monitor =
    text = [ SYSTEM_LOCK // ctOS // $USER ]
    color = rgb(180, 74, 255)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 82
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    rounding = 10
    outer_color = rgba(180, 74, 255, 0.5)
    inner_color = rgba(13, 10, 26, 0.9)
    font_color = rgb(212, 165, 255)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = > ENTER ACCESS CODE...
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}

# Keyboard layout
label {
    monitor =
    text = LAYOUT: $LAYOUT
    color = rgba(180, 74, 255, 0.4)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -52
    halign = center
    valign = center
}

# Bottom accent line
shape {
    monitor =
    size = 340, 2
    color = rgba(180, 74, 255, 0.7)
    rounding = 1
    position = 0, -72
    halign = center
    valign = center
}

# Status text
label {
    monitor =
    text = ACCESS RESTRICTED
    color = rgba(180, 74, 255, 0.25)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -92
    halign = center
    valign = center
}
