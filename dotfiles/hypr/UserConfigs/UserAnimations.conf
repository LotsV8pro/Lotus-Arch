#
# LOTUS Animations (Purple / Smooth)
# Fluid, modern, refined transitions

animations {
    enabled = true

    # Smooth material bezier
    bezier = lotus, 0.22, 0.61, 0.36, 1.0
    bezier = lotus-fast, 0.15, 0.8, 0.3, 1.0
    bezier = lotus-spring, 0.34, 1.56, 0.64, 1.0

    # Windows: slide with smooth ease
    animation = windows, 1, 5, lotus, slide
    animation = windowsOut, 1, 4, lotus-fast, slide

    # Borders: gentle pulse
    animation = border, 1, 10, lotus
    animation = borderangle, 1, 8, lotus

    # Fade: soft and smooth
    animation = fade, 1, 5, lotus

    # Workspaces: fluid slide
    animation = workspaces, 1, 5, lotus, slide

    # Special workspace
    animation = specialWorkspace, 1, 5, lotus, slidevert
}
