# DAC/amp ASUS USB-C (0b05:1d6e): el slider de PipeWire pasa a ser un
# atenuador de software. El mixer de hardware se deja FIJO (lo fija
# dac-asus-usb-hardware) para que el micro no vuelva a 0 dB (demasiado
# caliente: pico -3.3 dBFS con voz normal) ni los auriculares al maximo.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-Realtek_USB-C_Audio_Adapter"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
