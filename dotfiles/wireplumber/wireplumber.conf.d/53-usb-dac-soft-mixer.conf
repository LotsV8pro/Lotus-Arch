# ASUS USB-C DAC/amp (0b05:1d6e): the PipeWire slider becomes a software
# attenuator. The hardware mixer stays pinned (dac-asus-usb-hardware sets it)
# so the mic does not go back to 0 dB (too hot: peaks at -3.3 dBFS on normal
# speech) and the headphones do not sit at full volume.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-Realtek_USB-C_Audio_Adapter"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
