# RAM optimization drop-in (applied on top of the main inir.service):
# - MALLOC_ARENA_MAX=2: with 24 cores glibc spawns up to 24 malloc arenas,
#   fragmenting the heap. 2 arenas keep quickshell's heap compact.
# - MALLOC_MMAP_THRESHOLD_=131072: mmap allocations >=128 KiB straight from
#   the OS so they are returned on free instead of lingering in the heap.
[Service]
Environment=MALLOC_ARENA_MAX=2
Environment=MALLOC_MMAP_THRESHOLD_=131072