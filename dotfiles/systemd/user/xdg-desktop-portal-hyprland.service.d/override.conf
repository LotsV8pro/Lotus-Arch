[Unit]
# Don't start until Hyprland is actually running: the portal connects to the
# compositor over Wayland and logs "[CRITICAL] Couldn't connect to a wayland
# compositor" (then crash-loops against the restart limit) when it starts
# before the compositor is up. Hyprland creates this directory when it starts.
# PortalHyprland.sh restarts the portal after the compositor is ready anyway.
ConditionPathExists=/run/user/%U/hypr
