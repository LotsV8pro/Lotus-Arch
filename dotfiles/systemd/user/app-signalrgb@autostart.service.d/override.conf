# SignalRGB rewrites ~/.config/autostart/signalrgb.desktop with
# Exec=/opt/signalrgb/SignalRgb --silent, which fails because the binary
# cannot find libAppCore.so (the /usr/bin/signalrgb wrapper sets
# LD_LIBRARY_PATH, QML_IMPORT_PATH and the cwd).
# This drop-in always uses the wrapper, even after the app rewrites the file.
[Service]
ExecStart=
ExecStart=/usr/bin/signalrgb --silent
