# SignalRGB se autoescribe ~/.config/autostart/signalrgb.desktop con
# Exec=/opt/signalrgb/SignalRgb --silent, que falla porque el binario no
# encuentra libAppCore.so (el wrapper /usr/bin/signalrgb define
# LD_LIBRARY_PATH, QML_IMPORT_PATH y el cwd).
# Este drop-in fuerza siempre el wrapper, aunque la app reescriba el .desktop.
[Service]
ExecStart=
ExecStart=/usr/bin/signalrgb --silent
