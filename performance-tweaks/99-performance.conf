# Reduce swap tendency (64GB RAM, zram swap)
vm.swappiness=5

# Reduce dirty page ratios for smoother IO under load
vm.dirty_ratio=15
vm.dirty_background_ratio=5

# Keep more inode/dentry cache (helps loading times)
vm.vfs_cache_pressure=50

# Minimize page cluster (reduces cache/TLB misses)
vm.page-cluster=0

# Disable NUMA balancing (single socket CPU)
kernel.numa_balancing=0

# Allow real-time tasks to use unlimited CPU time
kernel.sched_rt_runtime_us=-1

# Disable autogroup scheduling (lower latency for foreground tasks)
kernel.sched_autogroup_enabled=0
